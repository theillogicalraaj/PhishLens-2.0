services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phishlens
      POSTGRES_USER: phishlens
      POSTGRES_PASSWORD: phishlens-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishlens -d phishlens"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://phishlens:phishlens-local-only@db:5432/phishlens
      JWT_SECRET: change-this-for-real-deployment
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  postgres_data:
